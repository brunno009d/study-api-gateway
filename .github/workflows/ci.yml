name: CI — Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder-service-key
          JWT_SECRET: placeholder-jwt-secret
          PORT: 8080
          USER_SERVICE_URL: http://localhost:3001
          CURRICULUM_SERVICE_URL: http://localhost:3002
          GRADES_SERVICE_URL: http://localhost:3003
          CALENDAR_SERVICE_URL: http://localhost:3004
          NOTES_SERVICE_URL: http://localhost:3005
          AI_SERVICE_URL: http://localhost:3006
        run: npm test
